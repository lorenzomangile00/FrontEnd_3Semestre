<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function saudacao() {
            alert(`Título: ${document.getElementById(`titulo`).textContent}`);
        }
        function mouseMoveu() {
            alert("Mouse se moveu no botao");
        }
        function clicouBaixo() {
            alert("Mouse se moveu no botao");
        }
        function clicouSubiu() {
            alert("Mouse se moveu no botao");
        }
        function cliqueDuplo() {
            alert("Voce clicou duas vezes no mouse");
        }
    </script>
</head>
<body>
    <h1 id="fontes">Olá, eu sou o título da página</h1>
    <button onclick="saudacao()">Click aqui</button>
    <button onmousemove="mouseMoveu()">Passe o mouse</button>
    <button onmousedown="clicouBaixo()">Segura o click</button>
    <button onmouseup="clicouSubiu()">Solta o botáo</button>
    <button ondblclick="cliqueDuplo()">Clicou duplo</button>

    
</body>
</html>
